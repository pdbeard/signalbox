# All-in-one Monitoring Reference Group
#
# A "kitchen sink" group listing all monitoring tasks in one place.
# No schedule is set — this intentionally avoids double-firing alongside
# the focused, scheduled groups in system_health.yaml and web_monitoring.yaml.
#
# To use: copy the tasks you need into your own group file and add a schedule.
# Exporting schedules with this file as-is produces no cron/systemd entries.
#
groups:
- name: comprehensive_monitoring
  description: All system and network checks in one parallel pass. No schedule set — copy tasks into your own group to avoid double-firing alongside system_health_check and web_health_check.
  execution: parallel
  tasks:
    - check_disk_space
    - check_memory_pressure
    - check_system_load
    - check_website_health
    - check_ssl_expiry
    - check_dns_resolution
    - ping_connectivity

