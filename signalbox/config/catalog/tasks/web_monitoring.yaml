# Web and Network Monitoring Tasks
#
# Generic tasks for checking website availability, SSL certificates,
# DNS resolution, and basic network connectivity.
#
# Replace example.com / https://example.com with your actual targets.
# Suitable for scheduling every 5-15 minutes via a group.
#
tasks:
- name: check_website_health
  description: "Check if a website responds with HTTP 2xx. Edit the URL to your target. Alerts on 4xx/5xx errors and connection failures. Uses a single curl request for both status and timing."
  command: |
    URL="https://example.com"
    # Single request captures both status code and response time
    RESULT=$(curl -s -o /dev/null -w "%{http_code} %{time_total}" --max-time 15 "$URL" 2>/dev/null)
    STATUS=$(echo "$RESULT" | awk '{print $1}')
    TIME=$(echo "$RESULT" | awk '{print $2}')
    echo "URL: $URL"
    echo "HTTP_STATUS: $STATUS"
    echo "Response time: ${TIME}s"
    case "$STATUS" in
      2*) echo "RESULT: OK" ;;
      3*) echo "RESULT: REDIRECT (may need updating)" ;;
      4*) echo "RESULT: CLIENT_ERROR" ;;
      5*) echo "RESULT: SERVER_ERROR" ;;
      000) echo "RESULT: CONNECTION_FAILED" ;;
      *) echo "RESULT: UNKNOWN" ;;
    esac
  timeout: 60
  log_limit:
    type: count
    value: 50
  alerts:
    - pattern: "RESULT: SERVER_ERROR"
      message: "Website is returning a server error (5xx)"
      severity: critical
    - pattern: "RESULT: CONNECTION_FAILED"
      message: "Website is unreachable — connection failed"
      severity: critical
    - pattern: "RESULT: CLIENT_ERROR"
      message: "Website returned a client error (4xx)"
      severity: warning

- name: check_ssl_expiry
  description: "Check SSL certificate expiry with two severity tiers: warning at 30 days, critical at 7. Edit HOST to match your domain. Uses a single TLS handshake for efficiency."
  command: |
    HOST="example.com"
    PORT=443
    echo "Checking SSL certificate for ${HOST}:${PORT}"
    CERT=$(echo | openssl s_client -connect "${HOST}:${PORT}" -servername "$HOST" 2>/dev/null)
    if [ -z "$CERT" ]; then
      echo "SSL_ERROR: Could not retrieve certificate for $HOST"
      exit 1
    fi
    echo "$CERT" | openssl x509 -noout -enddate -subject 2>/dev/null
    # Check expiry tiers against the already-fetched certificate (no extra TLS handshake)
    # checkend argument is in seconds: 604800 = 7 days, 2592000 = 30 days
    if ! echo "$CERT" | openssl x509 -noout -checkend 604800 2>/dev/null; then
      echo "SSL_CRITICAL: Certificate expires within 7 days — renew immediately"
    elif ! echo "$CERT" | openssl x509 -noout -checkend 2592000 2>/dev/null; then
      echo "SSL_WARNING: Certificate expires within 30 days — schedule renewal soon"
    else
      echo "SSL_OK: Certificate valid for 30+ days"
    fi
  timeout: 60
  log_limit:
    type: count
    value: 10
  alerts:
    - pattern: "SSL_CRITICAL"
      message: "SSL certificate expires within 7 days — renew immediately"
      severity: critical
    - pattern: "SSL_WARNING"
      message: "SSL certificate expires within 30 days — schedule renewal soon"
      severity: warning
    - pattern: "SSL_ERROR"
      message: "Could not retrieve SSL certificate — host may be unreachable"
      severity: warning

- name: check_dns_resolution
  description: "Verify DNS resolution is working for a domain. Edit DOMAIN to your target. Falls back to host if dig is not installed (common on minimal Debian/Ubuntu images). Alerts if the domain fails to resolve."
  command: |
    DOMAIN="example.com"
    echo "Resolving: $DOMAIN"
    RESULT=$(dig +short +time=5 +tries=2 "$DOMAIN" 2>/dev/null || host "$DOMAIN" 2>/dev/null)
    if [ -z "$RESULT" ]; then
      echo "DNS_FAILURE: No result for $DOMAIN"
      exit 1
    else
      echo "DNS_OK: $DOMAIN resolves to:"
      echo "$RESULT"
    fi
  timeout: 30
  log_limit:
    type: count
    value: 20
  alerts:
    - pattern: "DNS_FAILURE"
      message: "DNS resolution failed — domain may be unreachable or DNS is down"
      severity: critical

- name: ping_connectivity
  description: Check basic outbound network connectivity by pinging a reliable public host. Alerts on packet loss.
  command: |
    HOST="8.8.8.8"
    echo "Pinging $HOST..."
    ping -c 4 "$HOST"
  log_limit:
    type: count
    value: 50
  alerts:
    - pattern: "100\\.0% packet loss"
      message: "No network connectivity — all pings lost"
      severity: critical
    - pattern: "[1-9][0-9]\\.\\d% packet loss"
      message: "Network instability detected — significant packet loss"
      severity: warning
