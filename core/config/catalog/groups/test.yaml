# Error Handling Test Groups
#
# Demonstrates stop_on_error behaviour using fail_test (intentionally fails)
# followed by check_system_load to show whether the second task runs.
#
# - test_serial_fail:     stop_on_error=true  → check_system_load will NOT run
# - test_serial_continue: stop_on_error=false → check_system_load WILL run
#
groups:
- name: test_serial_fail
  description: Test serial with failure (DEMO - execution stops on error)
  execution: serial
  stop_on_error: true
  tasks:
  - fail_test
  - check_system_load

- name: test_serial_continue
  description: Test serial continue on error (DEMO - execution continues despite errors)
  execution: serial
  stop_on_error: false
  tasks:
  - fail_test
  - check_system_load
