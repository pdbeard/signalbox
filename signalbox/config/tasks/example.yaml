# User Tasks Directory
#
# This directory is for YOUR custom tasks.
# The catalog/ directory contains curated tasks maintained by the project.
#
# Example task format:
#
tasks:
  - name: hello
    command: echo "Hello"
    description: Hello task example
    log_limit:
      type: count
      value: 10
    alerts:
      - pattern: "Error"
        title: "My Task Error Alert"  # Optional: custom title for notifications
        message: "An error occurred"
        severity: critical
  - name: world
    command: echo "World"
    description: World task example
    timeout: 30  # Optional: per-task timeout in seconds (overrides execution.default_timeout)
    log_limit:
      type: count
      value: 10
    alerts:
      - pattern: "Error"
        title: "My Task Error Alert"  # Optional: custom title for notifications
        message: "An error occurred"
        severity: critical
#
# You can delete this file once you add your own tasks.
