# User Groups Directory
#
# This directory is for YOUR custom groups.
# The catalog/ directory contains curated groups maintained by the project.
#
# Example group format:
#
# groups:
#   - name: my_group
#     description: My custom group
#     tasks:
#       - my_task
#     execution: serial
#     schedule: "0 2 * * *"  # Optional cron expression
#
# You can delete this file once you add your own groups.
groups:
- name: Group example 
  description: group example
  execution: serial
  stop_on_error: true  # STOPS when fail_test fails
  tasks:
  - hello
  - world