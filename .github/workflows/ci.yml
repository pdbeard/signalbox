name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.14"]
        extras: ["dev"]
        include:
          # Tray helper tests only run when PyQt6 is installed
          - os: ubuntu-latest
            python-version: "3.12"
            extras: "dev,tray"
          # signalbox relies on POSIX process groups and fcntl; macOS is supported too
          - os: macos-latest
            python-version: "3.12"
            extras: "dev"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt runtime libraries
        if: contains(matrix.extras, 'tray')
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0

      - name: Install package
        run: pip install -e ".[${{ matrix.extras }}]"

      - name: Check formatting (black)
        run: black --check signalbox/ tests/

      - name: Lint (flake8)
        run: flake8 signalbox/

      - name: Unit tests and CLI smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash test_all.sh
